  <body>
    <main id="game-root" class="game-root">
      <canvas id="snake" width="608" height="608" tabindex="0" aria-label="Tablero de Snake">
        Tu navegador no soporta canvas. Usa un navegador moderno para jugar Snake.
      </canvas>

      <div id="controls" aria-label="Controles de juego">
        <button id="audio-btn" type="button" aria-label="Silenciar audio">🔊</button>
        <button id="pause-btn" type="button" aria-label="Pausar juego" disabled>⏸</button>
      </div>

      <div id="touch-controls" aria-label="Controles táctiles">
        <button id="btn-up" type="button" data-direction="UP" aria-label="Mover arriba" disabled>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M12 4L4 12H20L12 4Z" fill="currentColor" />
        </svg>
      </button>
      <div>
        <button id="btn-left" type="button" data-direction="LEFT" aria-label="Mover izquierda" disabled>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M4 12L12 4V20L4 12Z" fill="currentColor" />
          </svg>
        </button>
        <button id="btn-down" type="button" data-direction="DOWN" aria-label="Mover abajo" disabled>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M12 20L20 12H4L12 20Z" fill="currentColor" />
          </svg>
        </button>
        <button id="btn-right" type="button" data-direction="RIGHT" aria-label="Mover derecha" disabled>
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <path d="M20 12L12 20V4L20 12Z" fill="currentColor" />
          </svg>
        </button>
      </div>
    </div>

      <div id="overlay" class="visible" role="dialog" aria-labelledby="overlay-title" aria-describedby="overlay-description">
        <div class="modal">
          <h1 id="overlay-title">Snake</h1>
          <p id="overlay-description">Elige fruta y color para iniciar.</p>
          <p>Elige tu fruta:</p>
          <div class="choices" id="fruit-choices" aria-label="Fruta">
            <button class="fruit-choice" type="button" data-index="0" aria-label="Fruta 1"></button>
            <button class="fruit-choice" type="button" data-index="1" aria-label="Fruta 2"></button>
            <button class="fruit-choice" type="button" data-index="2" aria-label="Fruta 3"></button>
            <button class="fruit-choice" type="button" data-index="3" aria-label="Fruta 4"></button>
            <button class="fruit-choice" type="button" data-index="4" aria-label="Fruta 5"></button>
            <button class="fruit-choice" type="button" data-index="5" aria-label="Fruta 6"></button>
            <button class="fruit-choice" type="button" data-index="6" aria-label="Fruta 7"></button>
            <button class="fruit-choice" type="button" data-index="7" aria-label="Fruta 8"></button>
            <button class="fruit-choice" type="button" data-index="8" aria-label="Fruta 9"></button>
            <button class="fruit-choice" type="button" data-index="9" aria-label="Fruta 10"></button>
            <button class="fruit-choice" type="button" data-index="10" aria-label="Fruta 11"></button>
            <button class="fruit-choice" type="button" data-index="11" aria-label="Fruta 12"></button>
            <button class="fruit-choice" type="button" data-index="12" aria-label="Fruta 13"></button>
            <button class="fruit-choice" type="button" data-index="13" aria-label="Fruta 14"></button>
          </div>

          <p>Elige color de la snake:</p>
          <div class="choices" id="color-choices" aria-label="Color">
            <button class="color-choice color-choice--yellow" type="button" data-color="#ECD718" aria-label="Color amarillo"></button>
            <button class="color-choice color-choice--green" type="button" data-color="#3CC746" aria-label="Color verde"></button>
            <button class="color-choice color-choice--purple" type="button" data-color="#B84DF2" aria-label="Color morado"></button>
            <button class="color-choice color-choice--white" type="button" data-color="#F6F6F6" aria-label="Color blanco"></button>
            <button class="color-choice color-choice--cyan" type="button" data-color="#1BD9E6" aria-label="Color cyan"></button>
            <button class="color-choice color-choice--blue" type="button" data-color="#4F76F9" aria-label="Color azul"></button>
          </div>

          <button id="start-btn" type="button">Play</button>
        </div>
      </div>

      <p id="live-region" class="sr-only" aria-live="polite"></p>
    </main>

    <footer class="footer">
      Una creación de <a href="https://nadia.dev" target="_blank">&lt;micazoyolli /&gt; ✨</a>
    </footer>

    <script type="module" src="/src/game/main.ts"></script>
  </body>
</html>
